version: 2
updates:
  - package-ecosystem: cargo
    directory: /
    schedule:
      # Monthly evita el ruido de bumps menores semanales en deps Rust;
      # los CVEs reales llegan vía security advisories independientemente
      # del interval.
      interval: monthly
      day: monday
      time: "09:00"
      timezone: America/Santiago
    open-pull-requests-limit: 5
    commit-message:
      prefix: "deps"
      include: scope
    labels:
      - dependencies
      - rust
    # `ort` está pinned a `=2.0.0-rc.10` porque no hay 2.0.0 stable a fecha
    # 2026-05. Dependabot va a sugerir el bump cuando salga; no lo ignoramos
    # — queremos saberlo. Ver Cargo.toml comentario y CHANGELOG.

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    commit-message:
      prefix: "ci"
      include: scope
    labels:
      - dependencies
      - github-actions
